name: Aether Update

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
      - 'installer/**'
      - 'public/**'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'installer/**'
      - 'public/**'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: detect version
        id: ver
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          V=$(date -u +%Y%m%d)
          echo "VERSION=aether-${V}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Release already exists, skipping creation."
            echo "SKIP_RELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP_RELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: patch installer/
        if: steps.check_release.outputs.SKIP_RELEASE == 'false'
        run: bash installer/app/patch.sh all

      - name: tag and release
        if: github.event_name != 'pull_request' && steps.check_release.outputs.SKIP_RELEASE == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.VERSION }}"
          git tag -f "$TAG" HEAD
          git push --tags --force-with-lease
          gh release create "$TAG" \
            --title "Aether $(date -u +%Y-%m-%d)" \
            --prerelease \
            dist/*
