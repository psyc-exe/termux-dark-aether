name: Jules CI triage

on:
  pull_request:
    paths:
      - '.github/workflows/jules-ci-triage.yml'
      - 'scripts/jules-ci-triage*'
      - 'scripts/jules-env-setup.sh'
  workflow_run:
    workflows:
      - Aether Update
      - Build Aether Embedded APK
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jules-ci-triage
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/jules-env-setup.sh

  dispatch:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open a Jules troubleshooting task
        uses: actions/github-script@v7
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_GUIDE: handoff.md
        with:
          script: |
            const triage = require('./scripts/jules-ci-triage.cjs');
            await triage({github, context, core, apiKey: process.env.JULES_API_KEY, guide: process.env.JULES_GUIDE});
