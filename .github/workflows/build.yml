name: Build Aether Embedded APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'rootfs/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: install Android SDK 36 + NDK 29 + CMake
        uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "ndk;29.0.13113456" "cmake;3.22.1"

      - name: install rootfs build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap qemu-user-static zstd

      - name: build Debian rootfs
        run: bash rootfs/build-rootfs.sh

      - name: build pinned PRoot payload
        run: bash scripts/build-proot-payload.sh

      - name: copy assets into app
        run: |
          mkdir -p app/src/main/assets
          cp build/rootfs/debian-aether-arm64-rootfs.tar.zst app/src/main/assets/
          cp rootfs/manifests/debian-aether-arm64-rootfs.tar.zst.sha256 app/src/main/assets/
          cp build/proot/termux-proot-aarch64.tar.zst app/src/main/assets/
          cp rootfs/manifests/termux-proot-aarch64.tar.zst.sha256 app/src/main/assets/

      - name: build unsigned APK (X11 embedded)
        env:
          AETHER_INCLUDE_X11_MODULE: 1
          AETHER_USE_EXTERNAL_NATIVE_BUILD: 1
          AETHER_SIGN_RELEASE: 0
        run: bash scripts/build-aether-apk.sh

      - name: inspect APK structure
        run: bash scripts/inspect-aether-apk.sh app/build/outputs/apk/release/Aether-arm64-v8a.apk

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-arm64-v8a-unsigned
          path: |
            app/build/outputs/apk/release/Aether-arm64-v8a.apk
            app/build/outputs/apk/release/Aether-arm64-v8a.apk.sha256

      - name: upload inspection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-apk-inspection
          path: build/aether-logs/
